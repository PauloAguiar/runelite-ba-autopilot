// Avoid rewriting a UI kit jar held open by a running client during review builds.
gradle.beforeProject { p ->
    if (p.projectDir.canonicalPath.replace('\\', '/').endsWith('/plugins/ui-kit')) {
        p.plugins.withId('java') {
            p.tasks.named('jar') {
                def uiKitClassifier = p.findProperty('baReviewUiKitClassifier') ?: 'review'
                archiveFileName.set('freearcanes-uikit-1.0.0-ba-' + uiKitClassifier + '.jar')
            }
        }
    }
    // Optional package output when the running client also holds the normal plugin jar open.
    if (p.name == 'ba-autopilot' && p.findProperty('baReviewJar') == 'true') {
        def classifier = p.findProperty('baReviewClassifier') ?: 'reliability'
        p.plugins.withId('java') {
            p.tasks.named('jar') {
                archiveClassifier.set(classifier)
            }
            p.afterEvaluate {
                p.tasks.named('recorderJar') {
                    archiveClassifier.set(classifier + '-dev-recorder')
                }
            }
        }
    }
}
